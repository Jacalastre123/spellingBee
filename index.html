    let currentWord;



     async function getWord(word) {
        const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + word)

        const defTrue = await res.json();
            return defTrue[0].meanings[0].definitions[0].definition
     }

     async function define(words) {
        speechSynthesis.speak(new SpeechSynthesisUtterance(await getWord(currentWord)))
     }
        function start() {
            score = 0
            times = -1
            strikes = 3
                

        document.body.querySelector("form").addEventListener("submit", (event) => {

        })

            times++

            const speech = new SpeechSynthesisUtterance(currentWord)

            speech.lang = "en-UK"
            speechSynthesis.speak(speech)
            dial.close()

            document.body.style.backgroundColor = "gold"
        }

                speechSynthesis.speak(new SpeechSynthesisUtterance(currentWord))
                  score++
                  

            }

                speechSynthesis.speak(new SpeechSynthesisUtterance(currentWord))

            }

 details.innerHTML = strikes + " Strikes Remaining<br>"+ score + "/45"

                let speecho = speechSynthesis.speak(new SpeechSynthesisUtterance("Your the winner, now here is my speech, jf n wrogirwbfruhfwrbhejrf ner ikjerbgenrhgjobergerh bergjhrbgrtugrbguhdbtrugrhguerg brefug reygiruegbuf gnreufbrubig uryguirgbrhsd vfdurfghueid fbdfusdfgiufrdsuifdsbfusgrfrufhsdbf bsdh fvof rfbrfuhwbfwuefhw34fregbregrfw eu fhbwef uwehf bewwufehwf ue fybwefuewb. fewh fbfwefwne fwufbwd ihbgruithbgtugiegfgyrefhewfuewifewfefwuehfbwufbwnfehwjdnewifcuewfuywey. ghufb wuhfbrwuifewfhwibfuewbfwiuhfb ewufgwrfguwr v fgr vtry grwhgffbe wf ewiu f utgregiuer hgwei fewhfwegfiuwefewiu fig erg wreifgwefgiwf efrgftuwegfehuwfgewfewfg ewufg euw fgwffiewfi weufe jjdbhe vdv]"))
